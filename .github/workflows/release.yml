name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-latest
            platform: darwin-arm64
          - os: macos-13
            platform: darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack release tarball
        run: |
          chmod +x scripts/prepare-web-standalone.sh scripts/pack-release.sh scripts/install.sh scripts/self-update.sh
          bash scripts/pack-release.sh "${{ matrix.platform }}"
          cp scripts/install.sh install.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            xtrader-${{ matrix.platform }}.tar.gz
            install.sh
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
