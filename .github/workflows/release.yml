name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
      - name: Pack
        run: |
          mkdir -p dist-release/bin
          cp -R apps dist-release/
          cp -R packages dist-release/
          cp -R node_modules dist-release/ || true
          printf '#!/usr/bin/env bash\ncd "$(dirname "$0")/.."\nnode apps/api/dist/cli.js "$@"\n' > dist-release/bin/xtrader
          chmod +x dist-release/bin/xtrader
          tar -czf xtrader-${{ matrix.platform }}.tar.gz -C dist-release .
      - uses: softprops/action-gh-release@v2
        with:
          files: xtrader-${{ matrix.platform }}.tar.gz
