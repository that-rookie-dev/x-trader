name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      # @xtrader/domain exports point at dist/; build before tests/typecheck.
      - run: npm run build -w @xtrader/domain
      - run: npm test
      - run: npm run typecheck --workspaces --if-present
